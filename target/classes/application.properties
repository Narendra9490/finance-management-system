spring.application.name=finance-management-system
spring.profiles.active=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,metrics,beans,loggers
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Finance Management System
info.app.version=1.0.0
info.app.description=Finance REST API

springdoc.swagger-ui.path=/swagger-ui.html
app.file.upload-dir=uploads
app.cache.customer-ttl-note=Customer reads are cached; evict cache after update/delete.
